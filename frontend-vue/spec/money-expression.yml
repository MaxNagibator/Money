normalization:
  - удаляются все пробельные символы, включая неразрывные
  - запятая заменяется на точку

cases:
  - input: '1+2'
    expected: '3'

  - input: '1+2*3'
    expected: '7'

  - input: '(1+2)*3'
    expected: '9'

  - input: '1+5 555,00'
    expected: '5556'

  - input: '1,5+1'
    expected: '2.5'

  - input: '0,1+0,2'
    expected: '0.3'

  - input: '0,1*3'
    expected: '0.3'

  - input: '1 234,56'
    expected: '1234.56'

  - input: '-5+3'
    expected: '-2'

  - input: '--5'
    expected: '5'

  - input: '+5'
    expected: '5'

  - input: ',5'
    expected: '0.5'

  - input: '5.'
    expected: '5'

  - input: '1e3'
    expected: '1000'

  - input: '5%2'
    expected: '1'

  - input: '100000000000000000000+1'
    expected: '100000000000000000001'

  - input: '10/4'
    expected: '2.5'
    note: деление уходит в decimal вместо double

  - input: '10/3'
    expected: '3.333333333333333333333333333'
    note: 28 значащих цифр, вместо двоичной плавающей

  - input: '2^3'
    expected: null
    note: степень не поддерживается, побитовые операции тем более

  - input: 'Abs(-5)'
    expected: null
    note: функции убраны, поле суммы принимает только арифметику

  - input: 'Sqrt(16)'
    expected: null

  - input: '1>2'
    expected: null

  - input: 'true'
    expected: null

  - input: '1,2,3'
    expected: null

  - input: '1..2'
    expected: null

  - input: '(1+2'
    expected: null

  - input: 'abc'
    expected: null

  - input: ''
    expected: null

  - input: '1/0'
    expected: null
    note: деление на ноль не даёт суммы
