name: Frontend Vue

on:
  push:
    branches: [ "master" ]
    paths:
      - 'frontend-vue/**'
      - '.github/workflows/frontend-vue.yml'
  pull_request:
    branches: [ "master" ]
    paths:
      - 'frontend-vue/**'
      - '.github/workflows/frontend-vue.yml'
  workflow_call:
  workflow_dispatch:

jobs:
  verify:

    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    defaults:
      run:
        working-directory: ./frontend-vue

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend-vue/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend-vue/.node-version
          cache: pnpm
          cache-dependency-path: frontend-vue/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm verify

      - name: Install browser
        run: pnpm exec playwright install chromium

      - name: Playwright
        run: pnpm exec playwright test --project=specs

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend-vue/playwright-report
          retention-days: 7
