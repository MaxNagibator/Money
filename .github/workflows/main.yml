name: Main

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Select configuration'
        required: true
        type: string
        default: 'production'
      configuration:
        description: 'release/debug'
        required: true
        type: choice
        default: 'release'
        options:
          - debug
          - release
env:
  API_PROJECT_FILE: 'backend\Money.Api\Money.Api.csproj'
  API_PUBLISH_FOLDER: 'publish\api'
  
  WEB_PUBLISH_FOLDER: 'frontend-vue\dist'

jobs:
  build:
    if: ${{ github.event.inputs.tag != 'production' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

  integration:
    if: ${{ github.event.inputs.tag != 'production' }}
    permissions:
      pull-requests: write
      contents: write
      statuses: write
      checks: write
      actions: write

    uses: ./.github/workflows/integration.yml

  backend:
    if: ${{ github.event.inputs.tag != 'production' }}
    uses: ./.github/workflows/backend.yml

  frontend:
    if: ${{ github.event.inputs.tag != 'production' }}
    uses: ./.github/workflows/frontend.yml

  publish-smoke:
    if: ${{ github.event.inputs.tag != 'production' }}
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/publish-smoke.yml

  build-and-deploy:
    runs-on:
      labels: BobGroupWindowsServer
    environment: globals
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag == 'production' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET Core SDK ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: API Restore dependencies
        run: dotnet restore ${{ env.API_PROJECT_FILE }}

      - name: API Publish
        run: dotnet publish ${{ env.API_PROJECT_FILE }} -c ${{ github.event.inputs.configuration }} -o ${{ env.API_PUBLISH_FOLDER }}

      - name: API Copy new files
        env:
          SAMBA_USER: ${{ vars.SAMBA_USER }}
          SAMBA_PASS: ${{ secrets.SAMBA_PASS }}
        run: |
          $SambaServer = "192.168.0.17"
          $SambaShare = "publish"
          $DestDir = "\\$SambaServer\$SambaShare\bob217money\production\api"
          
          # Подключаем SMB-шару с аутентификацией
          net use \\$SambaServer\$SambaShare /user:$env:SAMBA_USER $env:SAMBA_PASS /persistent:no
          
          # Создаем папку назначения (если её нет)
          if (-not (Test-Path -Path $DestDir)) {
            New-Item -ItemType Directory -Path $DestDir -Force | Out-Null
          }
          
          # Копируем всё содержимое (рекурсивно)
          Copy-Item -Path "${{ env.API_PUBLISH_FOLDER }}\*" -Destination $DestDir -Recurse -Force -Exclude "web.config", "appsettings.json", "nlog.config"
          
          # Отключаем шару
          net use \\$SambaServer\$SambaShare /delete /y

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend-vue/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend-vue/.node-version
          cache: pnpm
          cache-dependency-path: frontend-vue/pnpm-lock.yaml

      - name: WEB Install dependencies
        working-directory: ./frontend-vue
        run: pnpm install --frozen-lockfile

      - name: WEB Build Vue
        working-directory: ./frontend-vue
        run: pnpm build

      - name: WEB Deploy Vue
        shell: pwsh
        env:
          SAMBA_USER: ${{ vars.SAMBA_USER }}
          SAMBA_PASS: ${{ secrets.SAMBA_PASS }}
        run: |
          $SambaServer = "192.168.0.17"
          $SambaShare = "publish"
          $DestDir = "\\$SambaServer\$SambaShare\bob217money\production\web-vue"
          $SourceDir = (Resolve-Path "${{ env.WEB_PUBLISH_FOLDER }}").Path

          & net.exe use \\$SambaServer\$SambaShare "/user:$env:SAMBA_USER" $env:SAMBA_PASS /persistent:no
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to connect to \\$SambaServer\$SambaShare"
          }

          try {
            New-Item -ItemType Directory -Path $DestDir -Force | Out-Null

            # Mirror only the dedicated Vue directory. The existing Blazor Web directory is untouched.
            # appsettings.json is managed directly on the server and must survive mirrored deployments.
            & robocopy.exe $SourceDir $DestDir /MIR /XF appsettings.json /R:2 /W:2 /NFL /NDL /NP
            if ($LASTEXITCODE -ge 8) {
              throw "Robocopy failed with exit code $LASTEXITCODE"
            }
          }
          finally {
            & net.exe use \\$SambaServer\$SambaShare /delete /y
          }
